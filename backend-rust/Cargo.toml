[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# The pinned aws-config 1.8 / aws-sdk-s3 1.123 pair declares Rust 1.91, so
# the workspace cannot claim a lower minimum while M5 ships the S3 backend.
rust-version = "1.91"
license = "MPL-2.0"
publish = false

# Versions are pinned to what resolves offline against the local cargo cache
# (see PLAN.md §1). Bump deliberately, and keep Cargo.lock committed so that
# `cargo build --offline` stays reproducible on a machine without registry
# access.
[workspace.dependencies]
# --- currently used (M1) ---
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
http-body-util = "0.1.5"
indexmap = "2.14.2"
# Byte-exact transit round-trips need the parser to recover the same f64 the
# writer printed. The default fast path can land on a neighbouring float.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
uuid = { version = "1.26.1", features = ["v4", "v5"] }

# --- test-only, shared by every crate that needs them ---
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
tower = { version = "0.5", features = ["util"] }

# --- shared async runtime (M3 rpc, M6 worker, M7 ws) ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "signal", "fs", "io-util", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.8"

# --- M4 session ---
# A single digest-0.10 generation: hkdf 0.12 / hmac 0.12 / blake2 0.10 /
# aes-gcm 0.10 / aes 0.8. Mixing them with the 0.13 line does not typecheck,
# and `aes-kw` 0.3.1 needs an `aes 0.9` that is not in the local cache, so
# RFC 3394 lives in `crates/session` on top of `aes 0.8` instead (PLAN.md §1).
aes = "0.8.4"
aes-gcm = "0.10.3"
blake2 = "0.10.6"
hex = "0.4.3"
hkdf = "0.12.4"
httpdate = "1.0.3"
rand = "0.8.8"
subtle = "2.6.1"
zeroize = { version = "1.8.2", default-features = false }

# --- M5 storage ---
async-trait = "0.1.92"
aws-config = "1.8.14"
aws-sdk-s3 = { version = "1.123.0", features = ["behavior-version-latest"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tempfile = "3.23.0"

# --- M7 ws ---
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
redis = { version = "0.27.6", default-features = false, features = ["tokio-comp"] }
sha1 = "0.10.7"
tokio-tungstenite = { version = "0.28.0", default-features = false }

# --- reserved for later milestones (added when the crate that needs them exists) ---
# tower-http = "0.6.11"
# sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
# tracing = "0.1.44"
# tracing-subscriber = "0.3.23"
# mime = "0.3.17"
# url = (cached, verify version when wiring ws/rpc)
#
# M4 crypto note: the cache holds a *consistent* digest-0.10 crypto set
# (hkdf 0.12.4 -> hmac 0.12.1, blake2 0.10.6, aes-gcm 0.10.3, aes 0.8.4).
# `aes-kw 0.3.1` is cached but needs `aes 0.9`/`cipher 0.5`, which are not, so
# RFC 3394 AES-KW is implemented in `crates/session` on top of `aes 0.8`.
# BLAKE2b is not an eager hash, so the HKDF call uses `SimpleHkdf`, which picks
# `SimpleHmac`; that is the same RFC 2104 construction over a variable-output
# digest. See backend-rust/PLAN.md §1.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Value constructors in this codec intentionally take the owned rep by value;
# clippy's guidance does not fit the tagged-value API shape.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
module_name_repetitions = "allow"
