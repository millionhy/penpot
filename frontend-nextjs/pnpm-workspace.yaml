storeDir: ../.pnpm-store

# Self-contained workspace: frontend-nextjs is installed independently of the
# ClojureScript frontend/ (cd frontend-nextjs && pnpm install), mirroring how
# frontend/ manages its own member packages. New shared TS packages that the
# Next.js shell owns (generated RPC types, design-system) live under packages/*.
packages:
  - "packages/*"

minimumReleaseAge: 0

allowBuilds:
  unrs-resolver: true

overrides:
  # Mirror of the frontend workspace override: the draft-js fork asks for
  # immutable ~3.7.4, and its @penpot wrapper imports immutable directly.
  # Without this the two would install separate copies and the values they
  # exchange would come from different module instances.
  immutable@<3.8.3: ^3.8.3
