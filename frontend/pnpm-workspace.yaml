storeDir: ../.pnpm-store

# Shared JavaScript/TypeScript packages that predate the Next.js shell. The
# ClojureScript application and its Shadow/Storybook toolchain lived here too
# until G4.7; only these framework-free packages remain.
packages:
  - "packages/draft-js"
  - "packages/mousetrap"
  - "packages/tokenscript"
  - "packages/ui"
  - "text-editor"

minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  canvas: true
  esbuild: true
